# Hugo + FixIt site config
# Migrated from VuePress (vuepress-theme-hope) on 2026-09-11

baseURL = "https://techstay.tech/"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
theme = "FixIt"
enableRobotsTXT = true
enableGitInfo = true
enableEmoji = true
hasCJKLanguage = false
# root-level Hugo config (not params.*) — drives home page list, archives, related posts
mainSections = ["posts", "tutorials"]

[pagination]
pagerSize = 6

[taxonomies]
category = "categories"
tag = "tags"

[markup]
_merge = "shallow"

# FixIt requires noClasses = false so its own chroma CSS
# (github light + github-dark dark mode) can style code blocks
[markup.highlight]
codeFences = true
noClasses = false
guessSyntax = true
lineNos = true
lineNumbersInTable = true

[markup.goldmark]
_merge = "shallow"

[markup.goldmark.renderer]
unsafe = true

# replicate theme defaults (theme [outputs] merge doesn't apply reliably)
[outputs]
home = ["html", "rss", "archives", "search", "offline", "manifest", "link"]
page = ["html", "markdown"]
section = ["html", "rss"]
taxonomy = ["html"]
term = ["html", "rss"]

[params]
# FixIt default keywords
keywords = ["techstay", "blog", "技术博客"]

[params.author]
name = "techstay"
link = "https://github.com/techstay"

[params.app]
title = "Techstay's Tech Blog"
noFavicon = false
svgFavicon = ""

[params.busuanzi]
enable = true
source = "https://events.vercount.one/js"
site_views = true
page_views = true

[params.analytics]
enable = true

[params.analytics.google]
id = "G-0QD3HGMX72"
anonymizeIP = true

[params.comment]
enable = true

[params.comment.giscus]
enable = true
repo = "techstay/techblog"
repoId = "R_kgDOJZ7KHA"
category = "Announcements"
categoryId = "DIC_kwDOJZ7KHM4CV9lO"
mapping = "pathname"
origin = "https://giscus.app"
strict = "0"
reactionsEnabled = "1"
emitMetadata = "0"
inputPosition = "bottom"
lightTheme = "light"
darkTheme = "dark"
lazyLoad = true

[params.footer]
enable = true
copyright = true
author = true
since = "2020"
license = 'Licensed under <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/deed.zh" target="_blank">CC BY-NC-ND 4.0</a>'

[params.footer.powered]
enable = true
hugo_logo = true
theme_logo = true

[params.home.posts]
enable = true
paginate = 6

[params.social]
Email = "lovery521@gmail.com"
GitHub = "techstay"

# Algolia search (https://fixit.lruihao.cn/zh-cn/guides/algolia-atomic/)
[params.search]
enable = true
type = "algolia"
content_length = 4000
placeholder = ""
max_result_length = 10
snippet_length = 30
highlight_tag = "em"
absolute_url = false
anchorify = true

[params.search.algolia]
app_id = "J6WF4RULX3"
search_key = "459d08b3c8c0e7aed74bb0c611c6116a"

